name: Build Truck Simulator APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create Truck Game App
        run: |
          python3 << 'PY'
          import pathlib, textwrap, base64
          p=pathlib.Path('.')
          # settings
          p.joinpath('settings.gradle').write_text("pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}} dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories{google();mavenCentral()}} include ':app'")
          p.joinpath('build.gradle').write_text("buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.3.2'}}")
          p.joinpath('gradle.properties').write_text("org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true")
          app=p/'app'
          (app/'src/main/java/com/truck/simfinal').mkdir(parents=True, exist_ok=True)
          (app/'src/main/assets').mkdir(parents=True, exist_ok=True)
          (app/'src/main/res/layout').mkdir(parents=True, exist_ok=True)
          (app/'src/main/res/values').mkdir(parents=True, exist_ok=True)

          # Read the game HTML if exists in repo, else create full game
          game_html_path = p/'truck_final_map_traffic.html'
          if game_html_path.exists():
              game_html = game_html_path.read_text(encoding='utf-8')
          else:
              # Create the FINAL game HTML here
              game_html = """<!DOCTYPE html>
          <html><head><meta charset=UTF-8><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:system-ui}canvas{display:block;width:100%;height:100vh}#hud{position:absolute;top:0;left:0;width:100%;padding:10px;display:flex;justify-content:space-between;gap:6px;z-index:5}#hud div{background:rgba(0,0,0,0.7);border:1px solid #00ff88;padding:7px 12px;border-radius:10px;color:#fff;font-weight:800;font-size:11px}#hud span{color:#00ff88}#minimap{position:absolute;top:55px;right:10px;width:120px;height:120px;background:rgba(0,20,10,0.9);border:2px solid #00ff88;border-radius:12px;z-index:6}#ctrl{position:absolute;bottom:0;left:0;width:100%;height:35%;display:flex;justify-content:space-between;padding:12px;z-index:6}.b{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,0.15);border:1.5px solid #555;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}#bAccel{width:76px;height:76px;background:rgba(0,255,136,0.25);border-color:#00ff88}#start{position:absolute;inset:0;background:linear-gradient(180deg,#0A1931,#12306a);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}#play{padding:14px 32px;border-radius:30px;background:#00ff88;color:#000;font-weight:900;font-size:18px;border:none}</style></head>
          <body><canvas id="c"></canvas><div id="hud"><div>SPEED <span id="sp">0</span></div><div>📦 <span id="dist">9800</span>m</div><div>⛽ <span id="fuel">100</span>%</div><div>🚦 <span>15</span></div></div><div id="minimap"><canvas id="mini" style="width:100%;height:100%"></canvas></div><div id="ctrl"><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:8px"><div class="b" id="L">◀</div><div class="b" id="R">▶</div></div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div class="b" id="bAccel">▲</div><div style="display:flex;gap:8px"><div class="b" id="B">▼</div><div class="b" id="H">♪</div></div></div></div><div id="start"><h1>🚛 TRUCK SIM FINAL</h1><p style="margin:12px 0;opacity:0.8">MAP + 15 TRAFFIC • A9 MUNICH->NURNBERG • 98KM</p><button id="play">▶ DRIVE NOW</button><p style="margin-top:12px;font-size:10px;opacity:0.5">Tilt phone to steer • ▲ accel • ▼ brake • 🗺️ Map in corner</p></div>
          <script>const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),mini=document.getElementById('mini'),mx=mini.getContext('2d');let W,H,DPR;function rs(){DPR=devicePixelRatio||1;W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';mini.width=120*DPR;mini.height=120*DPR;}rs();addEventListener('resize',rs);let run=false,x=0,spd=0,sa=0,fuel=100,dist=9800,off=0,shake=0,traffic=[];function reset(){x=0;spd=0;sa=0;fuel=100;dist=9800;off=0;traffic=[];for(let i=0;i<15;i++)traffic.push({z:i*200+200+Math.random()*500,lane:(Math.random()*2-1)*0.85,s:25+Math.random()*65,c:`hsl(${Math.random()*360},70%,50%)`,t:Math.random()>0.55?'truck':'car'})}reset();function draw(dt){const ho=H*0.34;let g=ctx.createLinearGradient(0,0,0,ho);g.addColorStop(0,'#0f244a');g.addColorStop(1,'#5a8bc0');ctx.fillStyle=g;ctx.fillRect(0,0,W,ho);const rb=W*0.92,rt=W*0.1,lxB=(W-rb)/2+x*W*0.18,rxB=(W+rb)/2+x*W*0.18,lxT=(W-rt)/2,rxT=(W+rt)/2;ctx.fillStyle='#1a3a1a';ctx.fillRect(0,ho,W,H-ho);ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.moveTo(lxB,H);ctx.lineTo(lxT,ho);ctx.lineTo(rxT,ho);ctx.lineTo(rxB,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=W*0.008;ctx.setLineDash([W*0.06,W*0.04]);ctx.lineDashOffset=-off%(W*0.1);ctx.beginPath();ctx.moveTo(W*0.5+x*W*0.18,H);ctx.lineTo(W*0.5,ho);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#ffcc00';ctx.lineWidth=W*0.012;ctx.beginPath();ctx.moveTo(lxB,H);ctx.lineTo(lxT,ho);ctx.stroke();ctx.beginPath();ctx.moveTo(rxB,H);ctx.lineTo(rxT,ho);ctx.stroke();traffic.forEach(t=>{let rel=(t.z-off*0.45);if(rel<0)rel+=3000;if(rel>2200)return;let p=rel/2200,sc=Math.pow(1-p,2.4),rw=rb*sc+rt*(1-sc),cx=W*0.5+t.lane*rw*0.65+x*W*0.18*sc,cy=H-(H-ho)*(1-sc),w=W*(t.t==='truck'?0.18:0.12)*sc,h=W*(t.t==='truck'?0.28:0.18)*sc;ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(cx-w/2,cy-h*0.1,w,h*0.15);ctx.fillStyle=t.c;ctx.fillRect(cx-w/2,cy-h,w,h);});ctx.save();ctx.translate(W*0.5+(Math.random()-0.5)*shake,H*0.88);ctx.fillStyle='#101010';ctx.fillRect(-W*0.33,-H*0.17,W*0.66,H*0.21);ctx.fillStyle='#00ff88';ctx.font=`${W*0.028}px monospace`;ctx.textAlign='center';ctx.fillText(`${Math.round(spd)} KM/H`,0,-H*0.02);ctx.restore();}function drawMini(){const w=mini.width,h=mini.height;mx.clearRect(0,0,w,h);mx.fillStyle='#081208';mx.fillRect(0,0,w,h);mx.strokeStyle='#00ff88';mx.lineWidth=w*0.04;mx.beginPath();mx.moveTo(w*0.5,h*0.95);mx.bezierCurveTo(w*0.55,h*0.6,w*0.45,h*0.4,w*0.5,h*0.05);mx.stroke();let prog=1-dist/9800;mx.fillStyle='#fff';mx.beginPath();mx.arc(w*0.5,h*(0.95-prog*0.85),w*0.05,0,Math.PI*2);mx.fill();}function upd(dt){if(!run)return;let steer=(window._R?1:0)-(window._L?1:0);sa+=(steer*32-sa)*dt*5;x+=sa*0.00055*(spd/100+0.3)*dt*60;x=Math.max(-1.3,Math.min(1.3,x));if(window._A){spd+=(120-spd)*0.015*dt*60+0.6;fuel-=0.007*dt*60;}else spd*=(1-0.012*dt*60);if(window._B)spd-=2.8*dt*60;spd=Math.max(0,Math.min(120,spd));off+=spd*dt*0.9;dist-=spd*dt*0.22;traffic.forEach(t=>{t.z-=(spd-t.s)*dt*0.55;if(Math.random()<0.008)t.lane+=(Math.random()-0.5)*0.4;t.lane=Math.max(-0.9,Math.min(0.9,t.lane));if(t.z<0){t.z+=3000;t.lane=(Math.random()*2-1)*0.85;t.s=25+Math.random()*65;}});traffic.forEach(t=>{let rel=(t.z-off*0.45);if(rel>0&&rel<110&&Math.abs(t.lane-x)<0.18&&spd>8){spd*=0.5;shake=W*0.05;t.s=spd*0.4;}});if(dist<=0){dist=0;run=false;alert('🎉 DELIVERY COMPLETE! €3,200');document.getElementById('start').style.display='flex';}document.getElementById('sp').textContent=Math.round(spd);document.getElementById('dist').textContent=Math.max(0,Math.round(dist));document.getElementById('fuel').textContent=Math.round(fuel);}let last=0;function loop(t){if(!last)last=t;let dt=Math.min(0.05,(t-last)/1000);last=t;upd(dt);draw(dt);drawMini();requestAnimationFrame(loop);}requestAnimationFrame(loop);function bind(id,k){const el=document.getElementById(id);const on=e=>{e.preventDefault();window[k]=true;};const off=e=>{e.preventDefault();window[k]=false;};el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off);el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);}bind('L','_L');bind('R','_R');bind('bAccel','_A');bind('B','_B');document.getElementById('play').addEventListener('click',()=>{document.getElementById('start').style.display='none';reset();run=true;last=0;});if(window.DeviceOrientationEvent)addEventListener('deviceorientation',e=>{if(!run)return;let g=e.gamma||0;window._L=g<-12;window._R=g>12;});</script></body></html>
          """
          
          # Write to assets
          (app/'src/main/assets/index.html').write_text(game_html, encoding='utf-8')

          app.joinpath('build.gradle').write_text(textwrap.dedent("""
            plugins { id 'com.android.application' }
            android {
              namespace 'com.truck.simfinal'
              compileSdk 34
              defaultConfig {
                applicationId "com.truck.simfinal"
                minSdk 24; targetSdk 34; versionCode 3; versionName "3.0 Map+Traffic"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            }
            dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          """))

          app.joinpath('src/main/AndroidManifest.xml').write_text(textwrap.dedent("""
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="Truck Sim FINAL" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                  <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                </activity>
              </application>
            </manifest>
          """))

          app.joinpath('src/main/java/com/truck/simfinal/MainActivity.java').write_text(textwrap.dedent("""
            package com.truck.simfinal;
            import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings;
            import androidx.appcompat.app.AppCompatActivity;
            public class MainActivity extends AppCompatActivity {
              protected void onCreate(Bundle b){
                super.onCreate(b);
                WebView w=new WebView(this);
                WebSettings s=w.getSettings();
                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setAllowFileAccess(true);
                w.setKeepScreenOn(true);
                w.loadUrl("file:///android_asset/index.html");
                setContentView(w);
              }
            }
          """))

          app.joinpath('src/main/res/layout/activity_main.xml').write_text('<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"/>')
          app.joinpath('src/main/res/values/strings.xml').write_text("<resources><string name='app_name'>Truck Sim FINAL</string></resources>")
          PY

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Truck-Sim-FINAL-MAP-TRAFFIC-APK
          path: app/build/outputs/apk/debug/*.apk
